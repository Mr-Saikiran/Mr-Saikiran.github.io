{%- assign b = include.badge -%}
<a class="card badge" href="{{ b.url }}" target="_blank" rel="noopener">
  <img class="badge-icon" loading="lazy" src="{{ b.image }}" alt="{{ b.name }} badge" width="80" height="80">
  <div>
    <h3>{{ b.name }}</h3>
    {% if b.issuer != "" %}<p class="issuer">{{ b.issuer }}</p>{% endif %}
    <p>{{ b.description }}</p>
  </div>
</a>
